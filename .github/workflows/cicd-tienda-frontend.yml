name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      # 1. Login en Docker Hub (Usando tus secrets DOCKER_USER y DOCKER_PASSWORD)
      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build y Push a Docker Hub
      - name: Build imagen Frontend y push a Docker Hub
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKER_USER }}/tienda-frontend:latest .
          docker push ${{ secrets.DOCKER_USER }}/tienda-frontend:latest

      # 3. Configurar credenciales AWS (Solo para poder usar el comando SSM)
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 4. Desplegar vía SSM (Ordenando a la EC2 que descargue de Docker Hub)
      - name: Desplegar Frontend vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Actualizar tienda-frontend desde Docker Hub" \
            --parameters '{"commands":[
              "set -e",
              "sudo docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}",
              "sudo docker pull ${{ secrets.DOCKER_USER }}/tienda-frontend:latest",
              "sudo docker stop tienda-frontend || true",
              "sudo docker rm tienda-frontend || true",
              "sudo docker run -d --name tienda-frontend -p 80:80 ${{ secrets.DOCKER_USER }}/tienda-frontend:latest"
            ]}' \
            --output text